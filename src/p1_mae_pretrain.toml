task_type = 'mae_pretrain'

[dataset]
type = 'folder'
root = 'data/unlabeled'
extensions = ['.jpg', '.jpeg', '.png']

[model]
name = 'mae_vit_base_patch16'
img_size = 224
norm_pix_loss = false

[training]
epochs = 400
batch_size = 64
blr = 1.5e-4
weight_decay = 0.05
warmup_epochs = 40
mask_ratio = 0.65
accum_iter = 1
use_amp = true
clip_grad = false
max_norm = 1.0
num_workers = 8
save_freq = 100

[training.transform]
input_size = 224
scale_min = 0.2
scale_max = 1.0
hflip = true

[output]
save_path = 'outputs/{task_id}'
log = true
